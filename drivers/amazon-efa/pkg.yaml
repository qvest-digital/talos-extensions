name: amazon-efa
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # The pkgs version for a particular release of Talos as defined in
  # https://github.com/siderolabs/talos/blob/<talos version>/pkg/machinery/gendata/data/pkgs
  #
  # The registry is pinned here instead of taken from BUILD_ARG_PKGS_PREFIX,
  # which every other extension shares. efa-pkg exists only in a fork of
  # siderolabs/pkgs, and pointing the shared prefix at that fork would send
  # base, kernel and every other package there too, none of which it
  # carries. Restore the shared prefix once efa-pkg is upstream.
  - image: "ghcr.io/qvest-digital/efa-pkg:{{ .BUILD_ARG_PKGS }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/lib/modules

        cp -R /usr/lib/modules/* /rootfs/usr/lib/modules
  - test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
