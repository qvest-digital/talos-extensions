name: intel-e810-oot
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # pkgs version for a particular release of Talos as defined in
  # https://github.com/siderolabs/talos/blob/<talos version>/pkg/machinery/gendata/data/pkgs
  #
  # The registry is pinned here rather than taken from
  # BUILD_ARG_PKGS_PREFIX: intel-e810-oot-pkg exists only in the fork of
  # siderolabs/pkgs, and pointing the shared prefix at the fork would
  # take base, the kernel and every other package from it too.
  - image: "ghcr.io/qvest-digital/intel-e810-oot-pkg@{{ .E810_OOT_PKG_REF }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/lib/modules /rootfs/usr/lib/firmware
        cp -R /usr/lib/modules/* /rootfs/usr/lib/modules
        # -L: ice.pkg, the DDP name the kernel loads, is a symlink in the
        # package, and imager v1.13.6 fails to stat it while compressing
        # the extension. intel-ice-firmware ships it as a regular file.
        cp -RL /usr/lib/firmware/updates /rootfs/usr/lib/firmware/
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
