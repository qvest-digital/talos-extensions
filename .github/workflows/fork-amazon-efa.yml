name: fork-amazon-efa

# Fork-only. The generated ci.yaml targets the self-hosted runner group
# "pkgs" that siderolabs operates and builds every extension in the repo,
# so it neither starts nor finishes here. This builds the one extension
# this branch exists for and publishes it to the fork's own registry.
#
# The branch sits on main, whose PKGS pin is the pkgs revision this fork
# published efa-pkg under. That is what makes the siderolabs base
# image and the efa-pkg this fork publishes resolve under one tag.
#
# Not part of the upstream contribution: kres does not generate this file
# and the upstream PR must not carry it.

on:
  push:
    branches:
      - feat/amazon-efa
    paths:
      - drivers/amazon-efa/**
      - Pkgfile
      - .github/workflows/fork-amazon-efa.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Lighter than the pkgs build - this packages a module rather than
      # compiling one - but the base image and the kernel modules it
      # copies still outsize what a hosted runner keeps free on /.
      - name: reclaim disk and move docker to /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PKGS is left at the tag's own pin. amd64 only, matching the
      # package: the EFA device exists on x86 instance types here.
      - name: build and push amazon-efa
        run: |
          make amazon-efa PUSH=true PLATFORM=linux/amd64 \
            USERNAME=${{ github.repository_owner }}
